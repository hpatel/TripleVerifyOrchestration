version: "3.9"

services:

  gateway:
    build: 
      context: ../gateway
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    depends_on: [orchestrator]

  orchestrator:
    build:       
      context: ../orchestrator
      dockerfile: Dockerfile      
    env_file:
      - ../.env
    volumes:
      - ../orchestrator:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload    
    depends_on:
      - planner
      - retriever
      - memory
      - critic
      - safety

  planner:
    build:       
      context: ../planner_service
      dockerfile: Dockerfile      
    volumes:
      - ../planner_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload


  retriever:
    build:       
      context: ../retriever_service
      dockerfile: Dockerfile      
    ports:
      - "8002:8000"
    env_file:
      - ../.env
    volumes:
      - ../retriever_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on: [memory]

  memory:  
    build:       
      context: ../memory_service
      dockerfile: Dockerfile      
    env_file:
      - ../.env
    volumes:
      - ../memory_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload    
    depends_on: [redis]

  tool:
    build:       
      context: ../tool_service
      dockerfile: Dockerfile      
    volumes:
      - ../tool_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8004 --reload    

  critic:
    build:       
      context: ../critic_service
      dockerfile: Dockerfile      
    volumes:
      - ../critic_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8005 --reload

  safety:
    build:       
      context: ../safety_service
      dockerfile: Dockerfile      
    volumes:
      - ../safety_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8006 --reload

  rag:
    build:       
      context: ../rag_service
      dockerfile: Dockerfile      
    volumes:
      - ../rag_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8007 --reload

  ui:
    build: ../ui
    ports:
      - "8501:8501"
    depends_on:
      - gateway

  redis:
    image: redis:7
    